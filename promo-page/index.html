<!-- 首帧防闪：在样式生效前定好主题与语言（跟随系统 / localStorage / URL 参数） -->
<script>
(function () {
  var d = document.documentElement;
  try {
    var q = new URLSearchParams(location.search);
    var t = q.get("theme") || null, l = q.get("lang") || null;
    if (t !== "dark" && t !== "light") t = localStorage.getItem("promo-theme");
    if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    d.classList.add(t);
    if (l !== "zh" && l !== "en") l = localStorage.getItem("promo-lang");
    if (l !== "zh" && l !== "en") l = (navigator.language || "zh").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
    d.setAttribute("lang", l === "zh" ? "zh-CN" : "en");
  } catch (e) { d.classList.add("light"); }
})();
</script>
